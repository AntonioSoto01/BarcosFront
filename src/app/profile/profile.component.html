<div class="container py-5">
  <div class="row">
    <div class="col-lg-4 mx-auto">
      <div class="card shadow">
        <div class="card-body">
          <div class="text-center">
            <img class="rounded-circle" src="path_to_user_image" alt="User Image" width="150">
            <h5 class="mt-3">{{ usuario.nombre }}</h5>
            <p class="text-muted">{{ usuario.email }}</p>
          </div>
          <hr>
          <div class="row">
            <div class="col">
              <h6 class="mb-0">Partidas</h6>
              <ul>
                <ng-container *ngFor="let partida of usuario.partidas">
                  <li *ngIf="partida.terminar">
                    Rival: {{ getRival(partida) }}
                    Ganador: {{ getGanador(partida) }}
                  </li>
                </ng-container>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
